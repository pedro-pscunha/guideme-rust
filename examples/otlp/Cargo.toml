[package]
name = "guideme-otlp"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace root: the example is not built by the library gate and keeps its
# dependency tree out of the crate's.
[workspace]

# tracing-opentelemetry 0.33 builds against opentelemetry 0.32, not 0.33. Every
# opentelemetry crate here must agree with it or the tracer will not satisfy the layer's
# trait bound.
[dependencies]
guideme = { path = "../../guideme" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "logs", "trace"] }
opentelemetry-appender-tracing = "0.32"
