[package]
name = "guideme"
description = "Type-safe inline judgments from TypeSafe Jev: if / match / score as Rust primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"

[[bin]]
name = "guideme-spec"
path = "src/bin/spec.rs"

[dependencies]
guideme-derive.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
schemars.workspace = true

[dev-dependencies]
# Already a dependency of the library; listed again so the integration tests can build the
# `reqwest::Client` that `api::ClientBuilder::http` takes. It adds nothing to the tree.
reqwest.workspace = true
proptest.workspace = true
wiremock.workspace = true
tracing-subscriber.workspace = true
trybuild.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
